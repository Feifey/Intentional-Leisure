<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intentional Leisure — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: #111111;
    }

    .container {
      text-align: center;
      padding: 0 24px;
      max-width: 520px;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 32px;
    }

    h1 {
      font-size: clamp(2rem, 5.5vw, 2.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: #111;
      margin-bottom: 20px;
    }

    p {
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.8;
      color: #666;
      margin-bottom: 48px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #e5e5e5;
      border-radius: 100px;
      padding: 10px 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #444;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.15; }
    }

    footer {
      position: fixed;
      bottom: 24px;
      width: 100%;
      text-align: center;
      font-size: 0.7rem;
      color: #bbb;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="tag">Intentional Leisure</span>

    <h1>We're working<br>on something.</h1>

    <p>
      A project about how people spend their free time —<br>
      and how they wish they could. Coming soon.
    </p>

    <div class="status">
      <span class="dot"></span>
      In progress
    </div>
  </div>

  <footer>Feifey &amp; Yuxuan &nbsp;·&nbsp; SVA 2026</footer>

</body>
</html>
